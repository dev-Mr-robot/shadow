[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-security-cli"
version = "0.2.0"
description = "Local conversational security research workstation for the terminal"
requires-python = ">=3.11"
dependencies = [
 "typer>=0.15,<1", "textual>=1,<8", "rich>=13,<15", "httpx>=0.28,<1",
 "pydantic>=2.10,<3", "psutil>=6,<8", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
 "pypdf>=5,<7", "defusedxml>=0.7,<1", "reportlab>=4,<5", "PyYAML>=6,<7"
]

[project.scripts]
shadow = "shadow.bootstrap:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadow = ["migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
